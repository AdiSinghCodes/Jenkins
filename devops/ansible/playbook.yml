---
# Idempotent Ansible Playbook for Employee Helpdesk System Target Node Provisioning
# Student: Aditya Singh (Roll No: 23102B0010)

- name: Provision and Deploy Employee Helpdesk System
  hosts: target_nodes
  become: yes
  vars:
    app_name: employee-helpdesk-system
    app_user: helpdesk
    app_group: helpdesk
    app_dir: /opt/helpdesk
    app_port: 8082
    docker_image: "adisingh/employee-helpdesk-system:v1.0.0"

  tasks:
    - name: 1. Update APT Package Cache (Ubuntu/Debian)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: 2. Install System Prerequisites (Java, Docker, Curl, Git, Nginx)
      package:
        name:
          - openjdk-17-jre-headless
          - docker.io
          - docker-compose
          - curl
          - git
          - nginx
        state: present

    - name: 3. Ensure Dedicated System Group Exists
      group:
        name: "{{ app_group }}"
        state: present

    - name: 4. Ensure Dedicated System User Exists
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /bin/false
        state: present

    - name: 5. Create Deployment Directory Structure
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/config"
        - "{{ app_dir }}/logs"

    - name: 6. Ensure Docker Service is Started and Enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: 7. Deploy Application Container
      docker_container:
        name: "{{ app_name }}-container"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ app_port }}:{{ app_port }}"
        env:
          PORT: "{{ app_port }}"
          SPRING_PROFILES_ACTIVE: "default"

    - name: 8. Verify Application Actuator Health Endpoint
      uri:
        url: "http://localhost:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: 9. Print Deployment Health Status
      debug:
        msg: "Target Node Successfully Provisioned! Health Status: {{ health_check.json.status | default('UP') }}"

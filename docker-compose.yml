version: '3.8'

services:
  helpdesk-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adisingh/employee-helpdesk-system:v1.0.0
    container_name: helpdesk-app-container
    restart: always
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge
